{% extends 'base.html' %}{% block content %}<section><h2>Editar cadastro</h2><form method="post"><label>Nome<input name="nome" value="{{ pessoa.nome }}" required minlength="2" maxlength="100"></label><label>E-mail<input name="email" type="email" value="{{ pessoa.email }}" required maxlength="150"></label><label>Telefone<input name="telefone" value="{{ pessoa.telefone }}" maxlength="25"></label><button>Salvar alterações</button><a href="{{ url_for('index') }}">Cancelar</a></form></section>{% endblock %}
