{% extends 'base.html' %}{% block content %}<section><h2>Novo cadastro</h2><form action="{{ url_for('criar') }}" method="post"><label>Nome<input name="nome" required minlength="2" maxlength="100"></label><label>E-mail<input name="email" type="email" required maxlength="150"></label><label>Telefone<input name="telefone" maxlength="25"></label><button>Cadastrar</button></form></section><section><h2>Pessoas cadastradas ({{ pessoas|length }})</h2><div class="scroll"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Ações</th></tr></thead><tbody>{% for p in pessoas %}<tr><td>{{ p.nome }}</td><td>{{ p.email }}</td><td>{{ p.telefone }}</td><td><a href="{{ url_for('editar',pessoa_id=p.id) }}">Editar</a><form class="inline" method="post" action="{{ url_for('excluir',pessoa_id=p.id) }}" onsubmit="return confirm('Excluir este cadastro?')"><button class="danger">Excluir</button></form></td></tr>{% else %}<tr><td colspan="4">Nenhuma pessoa cadastrada.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
